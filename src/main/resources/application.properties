spring.application.name=protcar

server.port=5000

# Configurações do Banco de Dados PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/protcar_db}
spring.datasource.username=${DB_USER:protcar}
spring.datasource.password=${DB_PASS:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Configurações de Segurança e JWT
api.security.token.secret=${JWT_SECRET:chave-secreta-protcar}
admin.username=${ADMIN_USER:admin}
admin.password=${ADMIN_PASS:123456}